name: Technocore Daily Check-in

on:
  schedule:
    - cron: "0 9 * * *"   # runs daily at 09:00 UTC — adjust as you like
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography

      - name: Run check-in
        env:
          TECHNOCORE_PRIVKEY_HEX: ${{ secrets.TECHNOCORE_PRIVKEY_HEX }}
          TECHNOCORE_DID: ${{ secrets.TECHNOCORE_DID }}
        run: python technocore_checkin.py
